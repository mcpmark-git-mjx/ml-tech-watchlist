name: Open ML tech watchlist issues

on:
  workflow_dispatch:

permissions: write-all

jobs:
  open-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Report repository settings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            | jq '{full_name, fork, has_issues, open_issues_count}'

      - name: Enable the repository Issues feature
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          response=$(curl -sS -w '\n%{http_code}\n' -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            -d '{"has_issues": true}')
          code=$(printf '%s' "$response" | tail -n 1)
          body=$(printf '%s' "$response" | sed '$d')
          echo "PATCH has_issues=true -> HTTP ${code}"
          printf '%s' "$body" | head -c 800
          echo

      - name: Create one issue per catalog row
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues"

          post() {
            title="$1"; body="$2"
            payload=$(jq -n --arg t "$title" --arg b "$body" '{title:$t, body:$b}')
            out=$(curl -sS -w '\n%{http_code}' -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}" -d "${payload}")
            code=$(printf '%s' "$out" | tail -n 1)
            echo "=== ${title} -> HTTP ${code}"
            if [ "$code" = "201" ]; then
              printf '%s' "$out" | sed '$d' | jq -r '.html_url'
            else
              printf '%s' "$out" | sed '$d' | head -c 400
              echo
            fi
          }

          post "Claude Code — tool review" $'Review task for the ML tech watchlist.\n\n**Technology:** Claude Code\n**GitHub repository:** https://github.com/anthropics/claude-code\n\n**Main functions:** Agentic coding tool that lives in the terminal: it reads a codebase, edits files, runs commands and handles git workflows from natural-language prompts, and ships with an SDK, plugins and a public issue tracker.\n\n**Playlist videos that cover it:**\n- Claude Code best practices | Code w/ Claude\n- I Tested Claude Code: $20 vs. $200 Subscription\n- Gemini CLI vs Claude Code vs Codex Compared! Should You Use an AI CLI?\n\nClaim this issue if you volunteer to review this tool.'

          post "Gemini CLI — tool review" $'Review task for the ML tech watchlist.\n\n**Technology:** Gemini CLI\n**GitHub repository:** https://github.com/google-gemini/gemini-cli\n\n**Main functions:** Open-source (Apache 2.0) command-line AI agent for Gemini: chats about a codebase, reads and edits files, runs shell commands, grounds answers with Google Search and adds tools through MCP servers.\n\n**Playlist video that covers it:**\n- Gemini CLI vs Claude Code vs Codex Compared! Should You Use an AI CLI?\n\nClaim this issue if you volunteer to review this tool.'

          post "OpenAI Codex CLI — tool review" $'Review task for the ML tech watchlist.\n\n**Technology:** OpenAI Codex CLI\n**GitHub repository:** https://github.com/openai/codex\n\n**Main functions:** Open-source terminal coding agent (Rust CLI plus TypeScript SDK) that plans and applies multi-file code changes and runs commands and tests inside a sandboxed environment.\n\n**Playlist video that covers it:**\n- Gemini CLI vs Claude Code vs Codex Compared! Should You Use an AI CLI?\n\nClaim this issue if you volunteer to review this tool.'

          post "OpenHands — tool review" $'Review task for the ML tech watchlist.\n\n**Technology:** OpenHands\n**GitHub repository:** https://github.com/OpenHands/OpenHands\n(the project was formerly published as All-Hands-AI/OpenHands — that URL now redirects here)\n\n**Main functions:** Open-source autonomous software-engineering agent plus the self-hosted Agent Canvas control center that runs coding agents and automations across local, Docker, VM and cloud backends with any LLM.\n\n**Playlist video that covers it:**\n- OpenHands + Devstral = A Fully Local Coding Agent\n\nClaim this issue if you volunteer to review this tool.'

          post "Qwen3-Coder — tool review" $'Review task for the ML tech watchlist.\n\n**Technology:** Qwen3-Coder\n**GitHub repository:** https://github.com/QwenLM/Qwen3-Coder\n\n**Main functions:** Open-weight, code-focused LLM family from the Qwen team (480B-A35B, 30B-A3B, Next): model cards, transformers quick-start code, links to the Hugging Face/ModelScope weights and notes for serving it with the SGLang/vLLM tool parsers.\n\n**Playlist video that covers it:**\n- Alibaba is coming for Claude...\n\nClaim this issue if you volunteer to review this tool.'
