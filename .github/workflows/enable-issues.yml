name: Enable repository issues

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  enable-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Turn on the Issues feature for this repository
        run: |
          set -euxo pipefail
          response=$(curl -sS -w '\n%{http_code}\n' -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            -d '{"has_issues": true}')
          status=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | head -n -1)
          echo "HTTP status: ${status}"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "PATCH failed"
            exit 1
          fi
          echo "$body" | grep -q '"has_issues": *true' || { echo "has_issues was not set to true"; exit 1; }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
