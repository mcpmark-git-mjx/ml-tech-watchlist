name: Open watchlist conflict issues

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Report repository settings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            | jq '{full_name, private, fork, has_issues, open_issues_count}'

      - name: Create one issue per registry conflict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues"

          post() {
            title="$1"
            body="$2"
            payload=$(jq -n --arg t "$title" --arg b "$body" '{title:$t, body:$b}')
            out=$(curl -sS -w '\n%{http_code}' -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}" -d "${payload}")
            code=$(printf '%s' "$out" | tail -n 1)
            echo "=== ${title} -> HTTP ${code}"
            if [ "$code" = "201" ]; then
              printf '%s' "$out" | sed '$d' | jq -r '.html_url'
            else
              printf '%s' "$out" | sed '$d' | head -c 600
              echo
            fi
          }

          post "Conflict: FlashAttention" $'Registry entry on file: https://github.com/HazyResearch/flash-attention\n\nVerified repo: https://github.com/Dao-AILab/flash-attention\n\nHazyResearch/flash-attention is the original Stanford Hazy Research location. The project has since moved, and that URL now redirects to Dao-AILab/flash-attention, maintained by Tri Dao, which holds the official FlashAttention / FlashAttention-2/3/4 implementation referenced by the playlist video "MedAI #54: FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness | Tri Dao".\n\nPlease update the registry entry to the verified repo above.'

          post "Conflict: Gemini CLI" $'Registry entry on file: https://github.com/google/gemini-cli\n\nVerified repo: https://github.com/google-gemini/gemini-cli\n\ngoogle/gemini-cli does not exist (404). The Gemini CLI project lives in the google-gemini organisation, not under google. Covered by the playlist video "Gemini CLI vs Claude Code vs Codex Compared! Should You Use an AI CLI?".\n\nPlease update the registry entry to the verified repo above.'

          post "Conflict: LangChain" $'Registry entry on file: https://github.com/langchain-ai/langchain\n\nVerified repo: - (none; no ML video in the playlist covers LangChain)\n\nNo video in the playlist walks through LangChain, so it has no place in the verified index (ml_tech.md).\n\nPlease drop the entry from the registry, or add a LangChain video to the playlist before re-adding it.'

          post "Conflict: MLflow" $'Registry entry on file: https://github.com/mlflow/mlflow\n\nVerified repo: - (none; no ML video in the playlist covers MLflow)\n\nNo video in the playlist walks through MLflow, so it has no place in the verified index (ml_tech.md).\n\nPlease drop the entry from the registry, or add an MLflow video to the playlist before re-adding it.'

          post "Conflict: o1 Reasoning" $'Registry entry on file: https://github.com/openai/openai-o1\n\nVerified repo: https://github.com/srush/awesome-o1\n\nopenai/openai-o1 does not exist (404); OpenAI publishes no repository for o1. The playlist covers o1 through the Sasha Rush tutorial "Speculations on Test-Time Scaling (o1)", whose companion repository (the o1 bibliography plus the o1 tutorial slides) is srush/awesome-o1.\n\nPlease update the registry entry to the verified repo above.'

          post "Conflict: OpenHands" $'Registry entry on file: https://github.com/All-Hands-AI/OpenHands\n\nVerified repo: https://github.com/OpenHands/OpenHands\n\nThe project organisation was renamed from All-Hands-AI to OpenHands, so the URL on file is outdated and now redirects. The canonical home is OpenHands/OpenHands, referenced by the playlist video "OpenHands + Devstral = A Fully Local Coding Agent".\n\nPlease update the registry entry to the verified repo above.'
