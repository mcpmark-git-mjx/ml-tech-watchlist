name: enable-issues
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Turn on the Issues feature for this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -f has_issues=true || echo "PATCH_FAILED"